name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e "backend[dev]"
      - name: Download tree-sitter grammars
        run: python -c "import tree_sitter_language_pack as t; t.download(['python','javascript','typescript','tsx','go','java','csharp'])"
      - name: Lint
        working-directory: backend
        run: |
          ruff check . ../scripts
          ruff format --check . ../scripts
      - name: Test
        working-directory: backend
        # Tests use a fake embedder and a fake LLM: Foundry Local is not needed.
        run: pytest -q

  frontend:
    name: Frontend (types + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
