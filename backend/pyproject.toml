[project]
name = "lodestar"
version = "0.1.0"
description = "A 100% local code-base assistant built on Foundry Local."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "foundry-local-sdk>=0.3",
    "numpy>=1.26",
    "fastembed>=0.4",
    "tree-sitter>=0.25,<0.26",  # 0.26 crashes with language-pack 1.20 grammars
    "tree-sitter-language-pack>=0.6",
    "pathspec>=0.12",
    "sse-starlette>=2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's `Depends(...)` default is the documented idiom

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"app/prompts.py" = ["E501"]  # prompts read better unwrapped
"tests/*" = ["E501"]
"tests/test_chunking.py" = ["E501", "E101"]  # Go sample source uses tabs
